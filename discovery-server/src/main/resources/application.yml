server:
  port: ${DISCOVERY_SERVER_PORT:18761}

spring:
  application:
    name: discovery-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    # Instancia unica, mas o Eureka ainda tenta replicar com um peer. Sem esta
    # linha ele usa o default localhost:8761 -- a porta antiga -- e inunda o log
    # com ERROR de conexao recusada a cada poucos segundos.
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:18761/eureka/}

management:
  endpoints:
    access:
      default: none
  endpoint:
    health:
      access: unrestricted
    info:
      access: unrestricted
