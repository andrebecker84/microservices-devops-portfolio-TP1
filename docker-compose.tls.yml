# Sobreposição que liga TLS no tráfego interno. NÃO substitui o compose base:
# soma-se a ele.
#
#   bash scripts/gerar-certificados.sh          uma vez, gera certs/
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
#
# Para voltar ao ambiente sem TLS, basta omitir o -f extra. Essa separação é
# deliberada: a configuração de referência continua sendo a que já foi validada,
# e o TLS é um perfil que se ativa por escolha, sem editar arquivo nenhum.
#
# O que passa a ser cifrado: JDBC → PostgreSQL, driver → MongoDB e a chamada
# project-service → profile-service. O Gateway e o Eureka permanecem em HTTP,
# porque são a fronteira que o navegador acessa durante a demonstração.

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: portfoliohub-postgres-tls
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/portfoliohub/server.crt
      - -c
      - ssl_key_file=/etc/ssl/portfoliohub/server.key

  mongo:
    build:
      context: .
      dockerfile: docker/mongo/Dockerfile
    image: portfoliohub-mongo-tls
    command:
      - mongod
      - --tlsMode
      - requireTLS
      - --tlsCertificateKeyFile
      - /etc/ssl/portfoliohub/mongo.pem
      - --tlsCAFile
      - /etc/ssl/portfoliohub/ca.crt
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --tls --tlsCAFile /etc/ssl/portfoliohub/ca.crt
          -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD}
          --eval "db.adminCommand('ping').ok"

  profile-service:
    volumes:
      - ./certs:/certs:ro
    environment:
      # verify-full valida a cadeia E o nome do servidor. sslmode=require apenas
      # cifra, sem verificar quem está do outro lado — protege contra escuta
      # passiva, não contra um impostor no meio.
      PROFILE_DB_URL: >-
        jdbc:postgresql://postgres:5432/${PORTFOLIO_DB_NAME:-profile_db}?sslmode=verify-full&sslrootcert=/certs/ca.crt
      # O truststore entra pela JVM, alcançando de uma vez o driver do Mongo,
      # o cliente do Eureka e o RestClient — sem alterar uma linha de código.
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/certs/truststore.p12
        -Djavax.net.ssl.trustStorePassword=changeit
        -Djavax.net.ssl.trustStoreType=PKCS12
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_BUNDLE: servidor
      SPRING_SSL_BUNDLE_PEM_SERVIDOR_KEYSTORE_CERTIFICATE: /certs/profile-service.crt
      SPRING_SSL_BUNDLE_PEM_SERVIDOR_KEYSTORE_PRIVATEKEY: /certs/profile-service.key
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/certs/ca.crt", "https://localhost:18081/actuator/health"]

  project-service:
    volumes:
      - ./certs:/certs:ro
    environment:
      PROJECT_MONGODB_URI: >-
        mongodb://${PORTFOLIO_MONGO_USER:-portfolio}:${PORTFOLIO_MONGO_PASSWORD:?defina PORTFOLIO_MONGO_PASSWORD}@mongo:27017/${PORTFOLIO_MONGO_DB:-project_db}?authSource=admin&tls=true
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/certs/truststore.p12
        -Djavax.net.ssl.trustStorePassword=changeit
        -Djavax.net.ssl.trustStoreType=PKCS12
      # O profile-service passou a atender em HTTPS; o nome lógico precisa ser
      # resolvido para o esquema seguro.
      PORTFOLIOHUB_PROFILE_CLIENT_SCHEME: https

  api-gateway:
    volumes:
      - ./certs:/certs:ro
    environment:
      # O Gateway continua ouvindo em HTTP na fronteira, mas fala HTTPS com os
      # serviços internos — por isso também precisa confiar na CA.
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/certs/truststore.p12
        -Djavax.net.ssl.trustStorePassword=changeit
        -Djavax.net.ssl.trustStoreType=PKCS12
